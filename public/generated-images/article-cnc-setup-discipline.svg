  </g>
  <circle cx="735" cy="610" r="76" fill="#f59e0b"/><path d="M700 610h70M735 575v70" stroke="#020617" stroke-width="14" stroke-linecap="round"/>
  <text x="120" y="120" fill="#38bdf8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="5">FACTORY SIGNAL</text>
