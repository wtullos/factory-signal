    <rect x="52" y="70" width="240" height="24" rx="12" fill="#0f172a"/><rect x="52" y="130" width="335" height="18" rx="9" fill="#334155"/><rect x="52" y="180" width="335" height="18" rx="9" fill="#334155"/><rect x="52" y="230" width="250" height="18" rx="9" fill="#334155"/>
