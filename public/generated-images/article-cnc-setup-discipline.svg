  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.15" stroke="#bfdbfe" stroke-width="3"><path d="M120 160H1480M120 310H1480M120 460H1480M120 610H1480"/><path d="M260 100V760M520 100V760M780 100V760M1040 100V760M1300 100V760"/></g>
  <rect x="210" y="235" width="560" height="360" rx="34" fill="#0b1220" stroke="#38bdf8" stroke-width="8"/>
  <rect x="300" y="355" width="380" height="120" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="7"/>
  <path d="M370 355v120M610 355v120" stroke="#f8fafc" stroke-width="10" opacity="0.75"/>
