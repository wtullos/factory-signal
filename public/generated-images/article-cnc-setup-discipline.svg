<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">CNC setup discipline and throughput</title>
  <desc id="desc">A deterministic vector illustration of a CNC setup packet, vise, tooling, and first-article measurement for small-shop throughput.</desc>
